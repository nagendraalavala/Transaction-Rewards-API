spring.application.name=Rewards API

# === H2 Database Config ===
spring.datasource.url=jdbc:h2:mem:rewardsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# === JPA Config ===
spring.jpa.hibernate.ddl-auto=update

# === H2 Console (disabled by default — enable via 'dev' profile) ===
spring.h2.console.enabled=false

# === SQL Init Mode (for data.sql) ===
spring.sql.init.mode=always

# === Actuator — expose only health endpoint ===
management.endpoints.web.exposure.include=health
management.endpoints.enabled-by-default=false
management.endpoint.health.enabled=true

# === CORS — configurable allowed origins (comma-separated) ===
app.cors.allowed-origins=https://yourdomain.com

