version: "3.9"

services:
  rewards-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rewards-api
    ports:
      - "${SERVER_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # --- Spring Application ---
      SPRING_APPLICATION_NAME: ${SPRING_APPLICATION_NAME:-Rewards API}

      # --- Datasource ---
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:h2:mem:rewardsdb}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:-org.h2.Driver}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-sa}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-}

      # --- JPA / Hibernate ---
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}

      # --- H2 Console ---
      SPRING_H2_CONSOLE_ENABLED: ${SPRING_H2_CONSOLE_ENABLED:-true}
      SPRING_H2_CONSOLE_PATH: ${SPRING_H2_CONSOLE_PATH:-/h2-console}

      # --- SQL Init ---
      SPRING_SQL_INIT_MODE: ${SPRING_SQL_INIT_MODE:-always}

      # --- Actuator ---
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}

      # --- Logging ---
      LOGGING_LEVEL_ROOT: ${LOGGING_LEVEL_ROOT:-INFO}
      LOGGING_LEVEL_COM_ASSESSMENT_REWARDS: ${LOGGING_LEVEL_COM_ASSESSMENT_REWARDS:-DEBUG}

      # --- CORS ---
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
